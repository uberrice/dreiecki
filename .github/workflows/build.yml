name: build

# Doc-only changes don't build. Path filters don't apply to tag pushes, so tags always release.
on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
    paths-ignore: &docs ['**.md', 'docs/**', '.gitignore']
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

# Runs on main and tags are queued, never cancelled; only PR runs get superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        name: Compute version
        run: |
          # Pushing a version tag releases that tag; everything else is a dev build.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="$GITHUB_REF_NAME"
          else
            v="dev-${GITHUB_SHA::7}"
          fi
          # The version reaches file names, -ldflags and the release title.
          if [ "$GITHUB_REF_TYPE" = tag ] && ! [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid version tag: $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: go test
        run: |
          node --version # the viewer tests skip without Node
          go test -race ./...

  # Runs the KiCad-gated tests. The release doesn't wait for it, as it uses a third-party PPA.
  kicad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install KiCad
        run: |
          # Ubuntu ships KiCad 7, which cannot plot several files at once.
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          command -v kicad-cli
      - name: Assert that KiCad can plot several files at once
        run: |
          # Otherwise the batch test would pass without testing anything.
          help=$(kicad-cli pcb export svg --help)
          echo "$help"
          for option in --mode-multi --common-layers; do
            case "$help" in
              *"$option"*) ;;
              *) echo "::error::kicad-cli has no $option; install KiCad 9 or newer"; exit 1 ;;
            esac
          done
      - name: go test with KiCad
        env:
          DREIECKI_REQUIRE_KICAD: "1"
        run: go test -run 'TestRenderWithKiCad|TestRenderPCBBatchWithKiCad' ./...

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        run: |
          name="dreiecki-$VERSION-$GOOS-$GOARCH"
          bin=dreiecki
          [ "$GOOS" = windows ] && bin=dreiecki.exe
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/$bin" .
          cp README.md "dist/$name/"
          cp -R docs "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read # release-notes.sh looks up which commits came through a pull request
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history and tags, to list the commits since the previous release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create release
        run: |
          # Merged pull requests as GitHub lists them, plus commits that didn't come through one.
          .github/release-notes.sh "$GITHUB_REPOSITORY" "$VERSION" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          cd dist
          sha256sum * > checksums.txt
          gh release create "$VERSION" * \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
